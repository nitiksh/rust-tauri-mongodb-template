[package]
name = "tauri-mongodb-app"
version = "1.0.0"
description = "A Tauri desktop application with MongoDB integration"
authors = ["Nitiksh contact@ntxm.org"]
license = "MIT"
repository = "https://github.com/nitiksh/rust-tauri-mongodb-template"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-log = "2"
mongodb = "3.1"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
dotenvy = "0.15"
futures = "0.3"
